[package]
name="strichka"
version="0.1.0"
edition="2021"

[[bin]]
name="strichka"
path="strichka.rs"

[dependencies]
postgres={version="0.19",features=["with-serde_json-1","with-chrono-0_4"]}
serde={version="1",features=["derive"]}
serde_json="1"
chrono={version="0.4",features=["serde"]}
base64="0.22"

[profile.release]
lto="thin"
codegen-units=1
strip=true
